# nginx server block for the Stocks Dashboard.
# Matches requests addressed to the bare droplet IP, so the travel site's
# default_server config keeps handling its own domain untouched.
# Install to /etc/nginx/conf.d/stocksdashboard.conf

server {
    listen 80;
    listen [::]:80;
    server_name 165.232.67.174;

    access_log /var/log/nginx/stocksdashboard.access.log;
    error_log  /var/log/nginx/stocksdashboard.error.log;

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
